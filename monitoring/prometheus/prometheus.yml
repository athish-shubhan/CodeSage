global:
  scrape_interval: 15s

scrape_configs:
  - job_name: gateway-api
    static_configs:
      - targets: ["gateway-api:8000"]
    metrics_path: /metrics

  - job_name: retrieval-service
    static_configs:
      - targets: ["retrieval-service:9101"]

  - job_name: traefik
    static_configs:
      - targets: ["traefik:80"]
    metrics_path: /metrics
