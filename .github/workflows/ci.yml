name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR makes the older run moot; master runs always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTEST: pytest==9.1.1 pytest-asyncio==1.4.0

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ruff==0.14.0
      - run: ruff check --output-format=github .

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [gateway-api, retrieval-service]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Generate gRPC stubs
        run: |
          pip install grpcio-tools==1.66.2
          cd services/${{ matrix.service }}
          python -m grpc_tools.protoc -I proto --python_out=. --grpc_python_out=. proto/retrieval.proto

      - name: Install CPU-only torch (retrieval-service)
        if: matrix.service == 'retrieval-service'
        run: pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r services/${{ matrix.service }}/requirements.txt $PYTEST

      - name: Run tests
        run: cd services/${{ matrix.service }} && python -m pytest tests/ -q

  integration:
    # Gateway and retrieval-service over real gRPC (embedded Qdrant, stand-in
    # embedder, scripted LLM). No torch needed: the embedding model is only
    # imported when a real embedding is requested.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/gateway-api/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r services/gateway-api/requirements.txt qdrant-client==1.11.3 bm25s==0.3.11 $PYTEST
      - name: Generate gRPC stubs
        run: |
          for d in services/retrieval-service services/gateway-api; do
            python -m grpc_tools.protoc -I $d/proto --python_out=$d --grpc_python_out=$d $d/proto/retrieval.proto
          done
      - name: Run integration tests
        run: python -m pytest tests/integration -q

  eval-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: eval/requirements.txt
      - name: Install dependencies
        run: pip install -r eval/requirements.txt
      - name: Generate gRPC stubs
        run: |
          python -m grpc_tools.protoc -I services/retrieval-service/proto \
            --python_out=eval --grpc_python_out=eval \
            services/retrieval-service/proto/retrieval.proto
      - name: Run eval harness unit tests
        run: cd eval && python -m pytest tests/ -q

  retrieval-smoke:
    # Blocking CI gate for the Context Engineer story: ingests a tiny fixed
    # fixture corpus into a real retrieval-service + Qdrant and asserts
    # Recall@K doesn't regress. The full 22-question ablation against this
    # repo's own content is a separate manual workflow (eval-ablation.yml) --
    # slower, and not something every PR should block on.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      qdrant:
        image: qdrant/qdrant:v1.11.3
        ports: ["6333:6333"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            services/retrieval-service/requirements.txt
            eval/requirements.txt

      - name: Install retrieval-service dependencies (CPU-only torch)
        run: |
          pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r services/retrieval-service/requirements.txt -r eval/requirements.txt

      - name: Generate gRPC stubs
        run: |
          python -m grpc_tools.protoc -I services/retrieval-service/proto \
            --python_out=services/retrieval-service --grpc_python_out=services/retrieval-service \
            services/retrieval-service/proto/retrieval.proto
          python -m grpc_tools.protoc -I services/retrieval-service/proto \
            --python_out=eval --grpc_python_out=eval \
            services/retrieval-service/proto/retrieval.proto

      - name: Start retrieval-service
        working-directory: services/retrieval-service
        env:
          QDRANT_URL: http://localhost:6333
        run: |
          python server.py > "$RUNNER_TEMP/retrieval-service.log" 2>&1 &
          timeout 60 bash -c 'until curl -sf http://localhost:9101 >/dev/null; do sleep 2; done'

      - name: Ingest fixture repo
        # Absolute path: the server resolves repo_path against its own cwd
        # (services/retrieval-service), not this step's.
        run: |
          python -c "
          import sys, grpc
          sys.path.insert(0, 'services/retrieval-service')
          import retrieval_pb2, retrieval_pb2_grpc
          channel = grpc.insecure_channel('localhost:50051')
          stub = retrieval_pb2_grpc.RetrievalStub(channel)
          resp = stub.IngestRepo(retrieval_pb2.IngestRequest(repo_path='$GITHUB_WORKSPACE/eval/fixture/repo', collection='ci_fixture'), timeout=120)
          print('ingested', resp.chunks_indexed, 'chunks from', resp.files_indexed, 'files')
          sys.exit(0 if resp.chunks_indexed else 'ingest indexed no chunks')
          "

      - name: Run retrieval-smoke eval (blocking gate)
        shell: bash
        run: |
          cd eval
          python run_eval.py --collection ci_fixture --qa-pairs fixture/qa_pairs.jsonl --min-recall 0.8 | tee "$RUNNER_TEMP/smoke.json"

      - name: Write job summary
        if: always()
        run: |
          [ -s "$RUNNER_TEMP/smoke.json" ] || exit 0
          { echo '### Retrieval smoke eval'; echo '```json'; cat "$RUNNER_TEMP/smoke.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Show retrieval-service log
        if: failure()
        run: cat "$RUNNER_TEMP/retrieval-service.log"

  build-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [gateway-api, retrieval-service]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v7
        with:
          context: services/${{ matrix.service }}
          tags: codesage/${{ matrix.service }}:ci
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  proto-sync:
    # Each service keeps its own copy of the proto so its Docker build
    # context is self-contained; this keeps the two copies from drifting.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: diff services/retrieval-service/proto/retrieval.proto services/gateway-api/proto/retrieval.proto

  compose-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.vllm.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.llamacpp.yml config --quiet

  k8s-manifests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate manifests parse as YAML
        run: |
          pip install pyyaml
          python -c "
          import glob, yaml
          for f in glob.glob('k8s/*.yaml'):
              list(yaml.safe_load_all(open(f)))
              print(f, 'OK')
          "
