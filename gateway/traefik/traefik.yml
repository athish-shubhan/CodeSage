api:
  dashboard: true
  insecure: true  # dashboard on :8080, fine for local/demo; disable or auth-gate in prod

entryPoints:
  web:
    address: ":80"

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

log:
  level: INFO

metrics:
  prometheus:
    entryPoint: web
    addServicesLabels: true
