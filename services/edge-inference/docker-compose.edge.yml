# Run just the inference-side services on a separate "edge" GPU box, while
# the gateway-api + Traefik + monitoring stay on a cheap cloud VM. The
# cloud VM never sees a GPU, and the edge box never needs a public IP,
# just an inbound port reachable from the cloud VM (for example over a
# WireGuard tunnel or VPC peering).
#
# Usage on the edge box:
#   docker compose -f services/edge-inference/docker-compose.edge.yml up
#
# Then point the cloud VM's gateway-api at it:
#   GATEWAY_LLM_BASE_URL=http://<edge-box-ip>:11434/v1
#   GATEWAY_RETRIEVAL_GRPC_TARGET=<edge-box-ip>:50051
services:
  ollama:
    image: ollama/ollama:0.3.12
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  retrieval-service:
    build:
      context: ../retrieval-service
      args:
        TORCH_VARIANT: cuda
    environment:
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_DEVICE: cuda
    ports:
      - "50051:50051"
      - "9101:9101"
    volumes:
      - ../../:/data/codesage-agent:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:v1.11.3
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"

volumes:
  ollama-data:
  qdrant-data:
