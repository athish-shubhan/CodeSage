apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval-service
  namespace: codesage
spec:
  replicas: 2
  selector:
    matchLabels: { app: retrieval-service }
  template:
    metadata:
      labels: { app: retrieval-service }
    spec:
      containers:
        - name: retrieval-service
          image: codesage/retrieval-service:latest
          ports:
            - containerPort: 50051
            - containerPort: 9101
          env:
            - name: QDRANT_URL
              value: "http://qdrant:6333"
            - name: OMP_NUM_THREADS  # match the CPU limit; torch otherwise uses every core on the node
              value: "2"
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "2", memory: "2Gi" }  # embedding model + gRPC worker pool
          readinessProbe:
            tcpSocket: { port: 50051 }
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket: { port: 50051 }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: retrieval-service
  namespace: codesage
spec:
  selector: { app: retrieval-service }
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
    - name: metrics
      port: 9101
      targetPort: 9101
