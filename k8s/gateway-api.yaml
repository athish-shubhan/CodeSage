apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-api
  namespace: codesage
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway-api }
  template:
    metadata:
      labels: { app: gateway-api }
    spec:
      containers:
        - name: gateway-api
          image: codesage/gateway-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: GATEWAY_LLM_BASE_URL
              value: "http://ollama:11434/v1"
            - name: GATEWAY_LLM_MODEL
              value: "llama3.1:8b-instruct-q4_0"
            - name: GATEWAY_RETRIEVAL_GRPC_TARGET
              value: "retrieval-service:50051"
            - name: GATEWAY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: jwt-secret
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          # /livez checks the process only, so a stalled LLM backend doesn't
          # trigger a pointless restart loop; /healthz checks dependencies
          # and gates whether this pod receives traffic at all.
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  namespace: codesage
type: Opaque
stringData:
  jwt-secret: change-me-in-production
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-api
  namespace: codesage
spec:
  selector: { app: gateway-api }
  ports:
    - port: 8000
      targetPort: 8000
