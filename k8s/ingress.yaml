# Uses Traefik's CRD-based IngressRoute since k3s ships Traefik as its
# built-in ingress controller. Adjust the host to whatever DNS you point
# at the k3s node's IP.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gateway-api
  namespace: codesage
spec:
  entryPoints: ["web"]
  routes:
    - match: Host(`codesage.local`)
      kind: Rule
      services:
        - name: gateway-api
          port: 8000
