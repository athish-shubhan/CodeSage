apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: codesage
spec:
  replicas: 1
  selector:
    matchLabels: { app: ollama }
  template:
    metadata:
      labels: { app: ollama }
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:0.3.12
          ports:
            - containerPort: 11434
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          resources:
            requests: { cpu: "1", memory: "4Gi" }
            limits:
              cpu: "4"
              memory: "8Gi"
              nvidia.com/gpu: 1  # remove this line on a CPU-only cluster
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: codesage
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: codesage
spec:
  selector: { app: ollama }
  ports:
    - port: 11434
      targetPort: 11434
